name: Release

# Push a tag like v0.2.0 (matching the version in public/manifest.json) to publish a release
# with the unpacked-extension zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./dist/manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/gannet-*.zip \
            --verify-tag \
            --title "Gannet $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
